[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "startup-success-model"
version = "0.1.0"
description = "Scores how closely a startup resembles failed vs successful startups, plus similar-startup lookup."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4", "joblib>=1.3"]

[project.optional-dependencies]
train = ["matplotlib>=3.8"]

[tool.setuptools]
packages = ["startup_model"]

[tool.setuptools.package-data]
startup_model = ["data/*.csv", "artifacts/*"]
